# CI книги рецептов (ADR-0014). Один образ собирается один раз, проходит миграции и e2e и только
# потом публикуется в GHCR. Прод-сервер сам забирает :stable (deploy/recipe-deploy.sh).
# Actions закреплены полным SHA; права — минимальные на каждый job; pull_request_target не используем.
name: ci

on:
  push:
    # feature/** — чтобы ветка проходила полный CI до переноса в main (PR у агента открыть нельзя:
    # fine-grained токен GitHub не работает с чужими репозиториями).
    branches: [main, "feature/**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # раз в неделю: свежие зависимости и уязвимости, без публикации
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # На main прогоны не отменяем: каждый доводит свой коммит до публикации (или уступает новому коду).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SITE_URL: https://mycoruja.food
  DATABASE_URL: postgres://recipe_app:recipe_app_dev@127.0.0.1:5434/recipe
  MIGRATION_DATABASE_URL: postgres://recipe_migrator:recipe_migrator_dev@127.0.0.1:5434/recipe
  # Вход владельца в CI — заведомо фальшивые значения, не настоящий бот. Ответы бота уходят в
  # заглушку Bot API из e2e (e2e/global-setup.ts) — сеть и Telegram не нужны.
  TELEGRAM_BOT_TOKEN: "1000000:ci-fake-token-not-a-real-bot-000000"
  TELEGRAM_BOT_USERNAME: ci_fake_recipe_bot
  TELEGRAM_WEBHOOK_SECRET: ci-fake-webhook-secret-not-real-0000000000
  OWNER_TELEGRAM_ID: "1000001"
  TELEGRAM_API_BASE: http://127.0.0.1:3999
  E2E_TELEGRAM_WEBHOOK_SECRET: ci-fake-webhook-secret-not-real-0000000000
  E2E_OWNER_TELEGRAM_ID: "1000001"
  E2E_TELEGRAM_STUB_PORT: "3999"
  # ИИ-разбор рецептов в CI — заглушка шлюза из e2e (e2e/support/ai-stub.ts), фальшивый ключ.
  AI_GATEWAY_API_KEY: ci-fake-ai-gateway-key-not-real-000000
  AI_GATEWAY_BASE_URL: http://127.0.0.1:3998/v1
  E2E_AI_STUB_PORT: "3998"

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        name: Код менялся? (docs-only коммиты образ не собирают)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          base=""
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            # На main — от ревизии, реально опубликованной в :stable, а не от прошлого push:
            # отменённый или уступивший прогон не должен «потерять» код.
            base=$(scripts/ci/published-revision.sh || true)
          elif [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            base="$BEFORE"
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            nondoc=$(git diff --name-only "$base" "$GITHUB_SHA" | grep -cvE '^(\.memory_bank/|docs/|README\.md$|$)' || true)
            [ "$nondoc" = "0" ] && code=false
          fi
          echo "база сравнения: ${base:-нет}, код менялся: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Схема Drizzle совпадает с миграциями
        run: |
          pnpm exec drizzle-kit generate
          git status --porcelain drizzle/
          test -z "$(git status --porcelain drizzle/)"
      - run: pnpm exec drizzle-kit check
      - run: node scripts/check-migrations.mjs

  image:
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Сборка — ДО запуска базы: публичные страницы обязаны собираться без БД (данные — только под
      # <Suspense> после io(), план public-pages); обращение к базе при сборке уронит этот шаг.
      - name: Сборка образа — один раз
        run: |
          docker build \
            --build-arg SITE_URL="$SITE_URL" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t recipe:ci .
      # Фото (ADR-0028): sharp и libvips для musl должны попасть в standalone-образ — кодируем и раскодируем внутри.
      - name: sharp в образе кодирует и раскодирует
        run: |
          docker run --rm --read-only --tmpfs /tmp --entrypoint node recipe:ci -e "
            const sharp = require('sharp');
            sharp({ create: { width: 64, height: 48, channels: 3, background: '#c33' } }).webp().toBuffer()
              .then((b) => sharp(b).metadata())
              .then((m) => { if (m.format !== 'webp' || m.width !== 64) process.exit(1); console.log('sharp', sharp.versions.sharp, 'vips', sharp.versions.vips); })
              .catch((e) => { console.error(e); process.exit(1); });"
      - name: База для проверок (та же, что локально)
        run: docker compose up -d --wait db
      - name: Миграции внутри образа (дважды) и параллельный запуск
        env:
          MIGRATE_COMMAND: docker run --rm --network host -e MIGRATION_DATABASE_URL recipe:ci node migrator/migrate.mjs
        run: |
          $MIGRATE_COMMAND
          $MIGRATE_COMMAND
          pnpm test:db
      # Лимиты — как у recipe-web на проде (deploy/recipe-deploy.sh): обработка фото должна в них укладываться.
      - name: Запуск образа как в проде (read-only, без прав, лимиты прода)
        run: |
          docker run -d --name web --network host \
            --cpus=.25 --memory=384m --memory-swap=384m --pids-limit=128 \
            --read-only --tmpfs /tmp:size=64m --tmpfs /app/.next/cache:size=128m,uid=10001,gid=10001 \
            --cap-drop=ALL --security-opt no-new-privileges \
            -e DATABASE_URL -e SITE_URL -e GIT_SHA="$GITHUB_SHA" \
            -e TELEGRAM_BOT_TOKEN -e TELEGRAM_BOT_USERNAME -e TELEGRAM_WEBHOOK_SECRET \
            -e OWNER_TELEGRAM_ID -e TELEGRAM_API_BASE -e AI_GATEWAY_API_KEY -e AI_GATEWAY_BASE_URL \
            recipe:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health/ready && exit 0
            sleep 2
          done
          docker logs web; exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e против собранного образа
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_EXPECT_SHA: ${{ github.sha }}
        run: pnpm e2e
      - name: Пик памяти сайта за e2e (лимит прода — 384 МБ)
        if: always()
        run: |
          docker exec web cat /sys/fs/cgroup/memory.peak 2>/dev/null | awk '{ printf "пик памяти: %.0f МБ\n", $1 / 1048576 }' || true
      - name: "Отказы: без БД live=200 и ready=503; без DATABASE_URL образ не стартует молча"
        run: |
          docker compose stop db
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health/live)" = 200
          test "$(curl -s -o /dev/null -m 10 -w '%{http_code}' http://127.0.0.1:3000/api/health/ready)" = 503
          set +e
          timeout 30 docker run --rm -e SITE_URL="$SITE_URL" recipe:ci
          code=$?
          set -e
          echo "exit=$code (ожидаем ошибку старта, не зависание)"
          test "$code" -ne 0 && test "$code" -ne 124
      - name: Логи контейнера при падении
        if: failure()
        run: docker logs web || true
      - name: Сохранить образ для публикации
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save recipe:ci | gzip > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: recipe-image
          path: |
            image.tar.gz
            image.tar.gz.sha256
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish:
    needs: [changes, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Публикуем, если после этого коммита в main нет нового кода
        id: head
        run: |
          git fetch -q origin main
          head=$(git rev-parse origin/main)
          if [ "$head" != "$GITHUB_SHA" ]; then
            nondoc=$(git diff --name-only "$GITHUB_SHA" "$head" | grep -cvE '^(\.memory_bank/|docs/|README\.md$|$)' || true)
            if [ "$nondoc" != "0" ]; then
              echo "в main уже новый код ($head) — его опубликует свой прогон, $GITHUB_SHA пропускаем"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.head.outputs.skip != 'true'
        with:
          name: recipe-image
      - name: Push :<sha>, затем :stable
        if: steps.head.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c image.tar.gz.sha256
          gunzip -c image.tar.gz | docker load
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag recipe:ci "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          docker tag recipe:ci "$image:stable"
          docker push "$image:stable"
          docker logout ghcr.io
