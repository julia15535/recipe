# Только для локальной разработки и тестов: пароли ниже — dev, в проде другие (deploy/README.md).
services:
  db:
    image: postgres:17-alpine
    container_name: recipe-devdb
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipe
      RECIPE_APP_PASSWORD: recipe_app_dev
      RECIPE_MIGRATOR_PASSWORD: recipe_migrator_dev
    volumes:
      - recipe-devdb:/var/lib/postgresql/data
      - ./deploy/recipe-roles.sql:/recipe/recipe-roles.sql:ro
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  recipe-devdb:
